name: Contribution Tetris
description: Turn your GitHub contributions into animated retro games (Tetris and a space shooter with a boss) for your profile README.
author: JuhaP2

branding:
  icon: grid
  color: purple

inputs:
  github_user_name:
    description: GitHub user whose contributions set the score.
    default: ${{ github.repository_owner }}
  github_token:
    description: Token used to read the contribution count.
    default: ${{ github.token }}
  output_dir:
    description: Folder the SVGs are written to.
    default: dist
  games:
    description: Comma-separated games to render. "tetris" writes tetris-dark.svg and tetris-light.svg, "invaders" writes invaders.svg.
    default: tetris,invaders

runs:
  using: composite
  steps:
    - name: Render game SVGs
      shell: bash
      run: |
        for game in ${GAMES//,/ }; do
          python3 "${{ github.action_path }}/$game.py" "${{ inputs.github_user_name }}" "${{ inputs.output_dir }}"
        done
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GAMES: ${{ inputs.games }}
